# FX daily trend-following bot. Separate from config.yaml on purpose: this bot
# is self-contained and does not share the engine's state or risk manager.
fx_trend:
  dry_run: true            # true = log intended trades only. Flip after demo validation.
  magic: 774201            # only positions with this magic are ever touched
  symbol_suffix: ""        # e.g. "m" or ".r" if your broker names EURUSDm
  pairs: [EURUSD, GBPUSD, USDJPY, AUDUSD, USDCAD, USDCHF, EURJPY, GBPJPY]

  strategy:
    # pullback: inside a long-term trend (200-day average), buy a sharp 2-day dip (sell a
    # sharp rally in a downtrend); leave when price recovers past the 5-day average, after
    # 5 days, or at the stop. Set style: trend for the old rules (they lost 36% in backtest).
    # The pullback edge is SMALL and sensitive to trading costs: see docs/FX_TREND_BOT.md.
    style: pullback
    sma_len: 200
    mom_len: 90
    atr_len: 14
    atr_stop_mult: 2.0     # stop-loss distance in ATRs, attached to every order
    rsi_len: 2
    rsi_entry: 5.0
    exit_sma_len: 5
    max_hold_days: 5
    risk_pct: 0.5          # % of equity lost if a stop is hit
    allow_short: true
    # Whipsaw filters: OFF until `run_fx_trend_backtest.py --walk-forward` says they help.
    min_entry_strength_atr: 0.0   # open only if |close-SMA| >= this many ATRs
    cooldown_days: 0              # wait N days to re-enter a pair after a losing close

  capital:
    # Compounding. Position size is always risk_pct of the *sizing equity*.
    # reinvest_pct 100 = full compounding: every dollar of profit raises future position sizes
    # (and drawdowns shrink them). Lower it to hold back part of the profit from risk, e.g. 50
    # sizes off starting capital + half of the profit. The bot never moves money: banked profit
    # stays in the account until YOU withdraw it at the broker.
    reinvest_pct: 100
    starting_capital: 0     # 0 = account equity when the bot first runs (set it if you top up)

  risk:
    max_open_positions: 4     # with risk_pct 0.5, about 2% of equity at risk if all stops hit
    max_net_per_currency: 3   # blocks e.g. long EURUSD+GBPUSD+AUDUSD+NZDUSD (one USD bet)
    daily_loss_halt_pct: 2.0
    weekly_loss_halt_pct: 4.0
    # Circuit breakers (count this bot's own closed trades).
    pause_after_losses: 4       # after 4 losses in a row: no new entries for pause_days,
    pause_days: 5               # then trade at pause_risk_factor x risk until a win
    pause_risk_factor: 0.5
    max_consecutive_losses: 7   # LOCK at 7. Entries are refused if open positions could reach 8.
    max_drawdown_halt_pct: 8.0  # LOCK if account equity falls 8% from its peak
    # Unlock after reviewing: python scripts/run_fx_trend_bot.py --reset-breaker
    max_spread_pips: 3.0
    max_lots_per_order: 1.0

  schedule:
    # Daily bars close at the broker's rollover. Each poll is cheap: it refreshes
    # the dashboard snapshot and probes ONE bar; the full analysis only runs when
    # a new daily bar has closed (idempotent: at most once per bar).
    poll_seconds: 60
    heartbeat_file: data/fx_trend_heartbeat.json
    kill_file: data/fx_trend.KILL
    state_file: data/fx_trend_state.json
    snapshot_file: data/fx_trend_snapshot.json
    journal_file: data/fx_trend.db
